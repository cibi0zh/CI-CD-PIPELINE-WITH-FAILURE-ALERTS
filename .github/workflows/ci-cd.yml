# =============================================================================
# Main CI/CD pipeline: build, test, scan, containerize, and deploy to EKS.
# Uses OIDC federation (permissions.id-token: write) instead of long-lived
# AWS access keys - see terraform/oidc for the trust configuration.
#
# Trivy and tfsec run as required checks: either one failing blocks the
# merge (configure this workflow as a required status check under the
# repo's branch protection rules for main).
#
# Production deploys go through the "production" GitHub Environment, which
# should have required reviewers configured in repo Settings > Environments
# - that's the staged-approval gate for this pipeline.
# =============================================================================
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd-pipeline/healthcheck
  EKS_CLUSTER_DEV: enterprise-cloud-platform-dev
  EKS_CLUSTER_PROD: enterprise-cloud-platform-prod

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/test-results.xml

  tfsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tfsec scan (required check)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          config_file: .tfsec.yml

  build-and-scan-image:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image (local, for scanning only)
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ steps.vars.outputs.image_tag }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t local/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }} \
            app/

      - name: Trivy scan (required check)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: local/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  push-to-ecr:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-test, tfsec, build-and-scan-image]
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      # Keyless auth: assumes the role created by terraform/oidc, no
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY anywhere in this repo.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push
        id: push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build-and-scan-image.outputs.image_tag }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg BUILD_VERSION="$IMAGE_TAG" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            -t "$IMAGE_URI" \
            app/
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: [push-to-ecr]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to dev EKS cluster
        run: ./scripts/deploy_to_eks.sh "$EKS_CLUSTER_DEV" app "${{ needs.push-to-ecr.outputs.image_uri }}"

      - name: Health check
        id: health
        run: ./scripts/health_check.sh https://dev.app.example.com 120

      - name: Rollback and alert on failure
        if: failure() && steps.health.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ./scripts/rollback.sh app healthcheck
          python3 scripts/slack_notify.py --status failure --stage deploy-dev \
            --message "Dev deploy failed health check, rolled back automatically" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------------
  # Staged approval: the "production" environment has required reviewers
  # configured in the repo settings, so this job pauses for manual sign-off
  # before it's allowed to run.
  # ---------------------------------------------------------------------
  deploy-prod:
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to prod EKS cluster
        run: ./scripts/deploy_to_eks.sh "$EKS_CLUSTER_PROD" app "${{ needs.push-to-ecr.outputs.image_uri }}"

      - name: Health check
        id: health
        run: ./scripts/health_check.sh https://app.example.com 120

      - name: Rollback and alert on failure
        if: failure() && steps.health.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ./scripts/rollback.sh app healthcheck
          python3 scripts/slack_notify.py --status failure --stage deploy-prod \
            --message "Production deploy failed health check, rolled back automatically" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 scripts/slack_notify.py --status success --stage deploy-prod \
            --message "Production deploy succeeded" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
